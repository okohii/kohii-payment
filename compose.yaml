services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=${DB_NAME}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_USER=${DB_USER}'
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d   # executa scripts na criação
      - pgdata:/var/lib/postgresql/18/main

  rabbitmq:
    image: 'rabbitmq:latest'
    environment:
      - 'RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}'
      - 'RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}'
    ports:
      - '5672'

volumes:
  pgdata: